spring:
  application:
    name: take-off-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    # Railway: set SPRING_DATASOURCE_URL=jdbc:${{Postgres.DATABASE_URL}}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/takeoff}
    username: ${SPRING_DATASOURCE_USERNAME:takeoff}
    password: ${SPRING_DATASOURCE_PASSWORD:takeoff}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

takeoff:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    admin-access-ttl-seconds: ${JWT_ADMIN_ACCESS_TTL:28800}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:604800}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  sms:
    enabled: ${SMS_ENABLED:false}
    brevo-api-key: ${BREVO_API_KEY:}
    sender: ${SMS_SENDER:TakeOff}
  courts:
    # Padel pricing. A full court is the whole booking; a share is one of its
    # four seats. Authoritative here and exposed read-only through
    # GET /api/v1/courts/pricing — the browser never decides what a booking costs.
    full-price-dt: ${COURT_FULL_PRICE_DT:80.000}
    seats-per-court: ${COURT_SEATS:4}
  auth:
    # US-3.2: when a phone matching a club-created (GHOST) account authenticates via
    # OTP, upgrade that account to ACTIVE (claim) so its history/debts/packs stay intact.
    ghost-claim-enabled: ${GHOST_CLAIM_ENABLED:true}
